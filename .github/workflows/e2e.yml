name: Paper E2E

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.agents/**'
      - '.codex/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.agents/**'
      - '.codex/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_TIMEOUT: "90000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out ARC runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: alexey-va/ARC
          ref: d1dc3bbc9a389d89530cb6ad3090425c73aaaa40
          path: e2e-arc
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Build ARC runtime
        working-directory: e2e-arc
        run: ./gradlew --no-daemon shadowJar
      - name: Run ArcFarms on real Paper
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          mapfile -t arc_jars < <(find "$GITHUB_WORKSPACE/e2e-arc/build/libs" -maxdepth 1 -type f -name 'ARC-*.jar' ! -name '*-plain.jar' -print | sort)
          test "${#arc_jars[@]}" -eq 1
          ./gradlew --no-daemon plugwrightTest "-Pe2eArcJar=${arc_jars[0]}" 2>&1 | tee build/plugwright-e2e.log
          git diff --exit-code -- src/test/e2e/package-lock.json
      - name: Upload Paper logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arcfarms-paper-e2e
          retention-days: 7
          path: |
            build/plugwright-e2e.log
            build/plugwright/logs/
            build/plugwright/crash-reports/
            build/plugwright/plugins/ArcFarms/config.yml
            build/plugwright/plugins/ArcFarms/data/state.json
