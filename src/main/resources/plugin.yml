name: ArcFarms
version: '${version}'
main: ru.ruscrafting.farms.paper.ArcFarmsPlugin
api-version: '1.21.11'
authors: [RusCrafting]
description: Shared farm, lumbermill, and mine activities
softdepend: [ARC, LuckPerms, WorldEdit, WorldGuard, PlaceholderAPI, Vault, RedisEconomy, packetevents]
commands:
  minelift:
    description: Call the mine lift or choose a floor near its landing
    usage: /minelift [1-5]
  arcfarms:
    description: Shared worksite activities
    usage: /arcfarms
permissions:
  arcfarms.farm:
    default: true
  arcfarms.lumber:
    default: true
  arcfarms.mine:
    default: true
  arcfarms.admin:
    default: op
