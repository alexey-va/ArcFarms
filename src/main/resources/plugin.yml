name: ArcFarms
version: '${version}'
main: ru.ruscrafting.farms.paper.ArcFarmsPlugin
api-version: '1.21.11'
authors: [RusCrafting]
description: Shared farm, lumbermill, and mine activities
depend: [ARC]
softdepend: [LuckPerms, WorldEdit, WorldGuard, PlaceholderAPI, Vault, RedisEconomy, packetevents, AuraSkills]
commands:
  minelift:
    description: Call the mine lift or choose a floor near its landing
    usage: /minelift [id] [floor]
  arcfarms:
    description: Shared worksite activities
    usage: /arcfarms
permissions:
  arcfarms.farm:
    default: true
  arcfarms.lumber:
    default: true
  arcfarms.lumber.beta:
    description: Participate in the closed lumbermill worksite
    default: false
  arcfarms.mine:
    default: true
  arcfarms.admin:
    default: op
  arcfarms.bypass:
    description: Toggle worksite editing without other administrator commands
    default: op
