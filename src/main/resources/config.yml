      lumber: {material: IRON_AXE, custom-model-data: 0}
      mine: {material: MINECART, custom-model-data: 0}
      workday: {material: WRITABLE_BOOK, custom-model-data: 0}
      stats: {material: BOOK, custom-model-data: 0}
