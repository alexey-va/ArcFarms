      # Override with /arcfarms admin point communal_farm fire-equipment beside the barn.
      fire-equipment: {x: 212.5, y: 49.0, z: 468.5}
      tool-material: IRON_HOE
      seed-amount: 16
      bow-material: BOW
      arrow-material: ARROW
      arrow-amount: 32
      fire-equipment-material: SPYGLASS
      fire-equipment-custom-model-data: 0
      fire-equipment-item-model: ''
      item-scale: 1.35
    delivery:
      x: 201.65
      y: 49.0
      z: 453.46
      radius: 2.5
      carried-forward-offset: 0.65
      proximity-pickup-radius: 1.75
      crates: 3
      spawn-radius: 24
      min-crate-spacing: 5.0
      pickup: {x: 212.5, y: 49.0, z: 463.5}
      item: {material: BARREL, custom-model-data: 0}
      display-transform: GROUND
      display-scale: 2.0
      display-y-offset: 0.55
      carried-scale: 1.5
      carried-y-offset: 0.65
      display-view-range: 2.0
    perks:
      harvest-area: {price: 250, duration-hours: 72, radius: 2}
