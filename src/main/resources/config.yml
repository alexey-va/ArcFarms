      sustenance: {price: 150, duration-hours: 72, interval-seconds: 3, food: 20, saturation: 10.0, health: 4.0}
      reward-boost: {price: 400, duration-hours: 72, bonus-percent: 75}
      strength: {price: 220, duration-hours: 72, amplifier: 1}
      resistance: {price: 240, duration-hours: 72, amplifier: 1}
      fire-resistance: {price: 160, duration-hours: 72}
      jump-boost: {price: 140, duration-hours: 72, amplifier: 1}
    rewards:
      # Every reward rolls independently. Commands run as console after the grant is durably claimed.
      # Supported command placeholders: %player%, %uuid%, %zone%, %sequence%, %contribution%, %rank%, %grant_id%.
      experience:
        amount: 100
