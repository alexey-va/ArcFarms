state:
  save-seconds: 10
  completed-cooldown-seconds: 60
  # A start reservation is never rolled back after an unknown atomic-write outcome.
  # These live-reloadable values cap exponential retry delay while the shift stays locked.
  shift-start-persistence:
    initial-retry-seconds: 1
    maximum-retry-seconds: 30
    log-every-attempts: 5

# OFF disables the company, SHADOW observes without money, LIVE enables durable funding and payouts.
# Keep LIVE off until the shadow report has been reviewed. The same policy shape fits future worksites.
enterprises:
  farm:
    mode: "OFF"
    company-id: communal_farm
    worksite-id: communal_farm
    license-gross-envelope: 2000000.00
    default-gross-tariff: 10000.00
    order-gross-tariffs:
      miners_rations: 10000.00
      bakery_supply: 10000.00
      market_crates: 12000.00
      harvest_festival: 18000.00
      deep_mine_relief: 15000.00
      master_baker_request: 18000.00
    operating-cost-percent: 20
    worker-bonus-percent: 30
    dividend-percent: 50
    weekly-upkeep: 25000.00
    retained-report-weeks: 16
    # Reloadable for future reservations; already accepted orders keep their recorded week id.
    business-week:
      zone: Europe/Moscow
      day: SUNDAY
      time: '20:00'
    # A LIVE company snapshots these terms when its funding window first opens.
    # Later reloads affect only a future company cycle; existing ownership never changes silently.
    capital:
      total-shares: 100
      share-price: 50000.00
      max-shares-per-owner: 20
      funding-duration-days: 7
      license-burn-percent: 50
      license-weeks: 12
      reserve-target-weeks: 1
      purchase-options: ['1', '5', '10', '20']

debug:
  enabled: false

destinations:
  farm: {server: spawn, world: sp11, x: 201.65, y: 49.0, z: 453.46, yaw: -45.97, pitch: 2.55}
  lumber: {server: spawn, world: world, x: 255.69, y: 54.0, z: -1482.37, yaw: 41.33, pitch: -1.04}
  mine: {server: spawn, world: sp11, x: 417.74, y: 29.0, z: 338.98, yaw: -70.72, pitch: 4.65}

farm-zones:
  communal_farm:
    enabled: true
    world: sp11
    region: farm
    permission: arcfarms.farm
    preparation-patch-size: 100
    preparation-patch-max-size: 256
    # Finish at this share so one hidden or unreachable bed never blocks the stage.
    field-completion-percent: 90
    preparation-search-radius: 64
    # Full-block crops are restored at their recorded coordinates after this delay.
    fixed-crop-respawn-seconds: 20
    # Recovery after incidents and completed orders is spread across server ticks.
    restore-blocks-per-tick: 24
    # A full farm block reindex scans and applies this many blocks per server tick.
    block-reindex-blocks-per-tick: 131072
    # Refuse accidentally huge WorldGuard bounds instead of freezing the server.
    block-reindex-max-blocks: 20000000
    # An explicit reindex rebuilds ordinary crop beds as coherent single-crop components.
    # Melon/pumpkin blocks and their stems remain manually authored and are never replanted here.
    crop-layout:
      enabled: true
      weights:
        WHEAT: 30
        CARROTS: 25
        POTATOES: 25
        BEETROOTS: 15
        SWEET_BERRY_BUSH: 1
      # Tiny nearby islands visually inherit the crop of a larger bed instead of creating stripes.
      small-component-max-size: 16
      small-component-merge-distance: 10
    # Farm backups capture the configured region and process it in bounded main-thread slices.
    backup-blocks-per-tick: 2048
    backup-max-blocks: 4000000
    care-radius: 10
    care-types: [WEEDS, IRRIGATION, POLLINATION, APPLE_HARVEST, STORM_COVERS, SCARECROWS, ANIMAL_RESCUE, DISEASE, MOLES, DITCH_RESCUE]
    # Physical care objects scale with active workers, but remain bounded.
    care-targets-per-player: 15
    care-targets-max: 45
    care-spawns-per-update: 10
    # Delivery-style care uses a compact fixed scene instead of the general per-player target count.
    scarecrow-target-count: 5
    scarecrow-min-spacing: 12.0
    # One hive pickup supports this many flower patches.
    pollination-charges: 5
    # Irrigation dries the managed field gradually; valves may be opened in any order and hydrate it in circular waves.
    irrigation:
      dry-blocks-per-tick: 24
      wave-blocks-per-tick: 24
      wave-start-delay-ticks: 4
      ring-interval-ticks: 2
      ring-width: 1.25
      particle-spacing: 1.25
      particle-height: 2.0
      particle-spread: 0.38
      particle-count: 3
    # Hang many apples over the orchard, but complete the activity after this many arbitrary picks.
    apple-targets: 10
    apple-placement-count: 40
    # Bound entity creation so a large orchard never spikes one server tick.
    apple-spawns-per-update: 20
    apple-min-spacing: 4.0
    apple-display-scale: 1.35
    apple-display-y-offset: -0.82
    apple-interaction-y-offset: -0.88
    apple-leaf-index-limit: 8192
    animal-rescue-targets: 6
    animal-rescue-min-spacing: 8.0
    animal-rescue-max-player-distance: 28
    animal-delivery-radius: 3.0
    # Idle supply displays (hoe, seeds, water, bow and fire equipment) are visible within this many blocks.
    # Equipment is issued automatically; enable only to show optional pickup points.
    supply-points-visible: false
    supply-nearby-view-distance: 15.0
    display-view-range: 2.0
    seeder-every-shifts: 2
    # Machinery may combine this many nearby same-height beds into one field.
    seeder-patch-size: 3840
    seeder-patch-max-size: 6144
    seeder-component-gap: 16
    seeder-component-limit: 8
    # The player rides the horse; this many leashed pigs work in a row ahead of it.
    seeder-pig-count: 3
    seeder-pig-lead-distance: 2.5
    seeder-pig-spacing: 1.4
    seeder-pig-catchup-distance: 12.0
    seeder-horse-speed: 0.24
    seeder-pig-speed: 0.46
    # Every indexed bed inside this radius around any working pig is processed.
    seeder-working-radius: 8.0
    # Bounds tilling/planting mutations per machinery update (every 5 ticks).
    seeder-blocks-per-update: 128
    disease-initial-spots: 2
    disease-max-spots: 10
    disease-spread-seconds: 3
    disease-spread-radius: 4.0
    disease-kill-seconds: 16
    scarecrow-delivery-radius: 2.5
    scarecrow-pickup-radius: 1.75
    scarecrow-carried-y-offset: 1.15
    # Temporary, crash-safe maze carved below the farm for the mole expedition.
    mole-burrow:
      cells: 8
      # One independent maze per active participant, capped to avoid excessive block work.
      max-burrows: 3
      min-depth: 10
      max-depth: 56
      tunnel-height: 3
      # Logical maze corridors are expanded to this many blocks in both horizontal axes.
      tunnel-width: 2
      # Do not put entrances on the outermost beds when the farm has enough interior space.
      entrance-min-boundary-distance: 10
      blocks-per-tick: 256
      candidate-attempts: 96
      light-spacing: 5
      light-level: 11
      chambers: 3
      moles: 8
      decoration-percent: 28
      guidance: {close-distance: 6, far-distance: 14, interval-ticks: 20}
      # Search through ordinary blocks and existing caves alike. Only liquids and
      # gravity blocks are skipped so the active tunnel is not flooded or collapsed.
      lair-visual:
        # Portable fallback; the live server may replace this with a fitted ItemsAdder cave prop.
        material: MUD
        custom-model-data: 0
        display-transform: GROUND
        display-scale: 1.4
        display-y-offset: 0.05
    care-animal-entities: [CHICKEN, SHEEP]
    care:
      animal-follow-distance: 1.5
      animal-follow-speed: 1.25
      animal-follow-impulse-base: 0.16
      animal-follow-impulse-per-block: 0.025
      animal-follow-impulse-max: 0.42
      animal-follow-impulse-smoothing: 0.25
    procedural-care-fixtures: true
    placement-min-objective-distance: 10
    placement-max-player-distance: 28
    placement-search-radius: 32
    placement:
      receiving-exclusion-padding: 1.5
    input-cooldowns: {supply-millis: 500, delivery-millis: 500, patch-miss-millis: 500, care-millis: 100, care-target-millis: 250, mole-millis: 500, frost-pickup-millis: 750, contract-scene-millis: 700}
    music:
      enabled: false
      sound: minecraft:music.overworld.forest
      # Vanilla, redistributable soundtrack for the rival-farm flight.
      rival-raid-sound: minecraft:music_disc.pigstep
      duration-seconds: 180
      volume: 0.65
    contract-scene:
      cart:
        material: MINECART
        custom-model-data: 0
        display-transform: GROUND
        scale: 1.0
        y-offset: 0.15
        yaw-offset: 0.0
        load-y-offset: 0.4
        load-scale: 1.1
        view-range: 2.0
    care-visuals:
      seeder-horse: {material: SADDLE, custom-model-data: 0}
      weed-root: {material: MANGROVE_ROOTS, custom-model-data: 0}
      valve: {material: TRIPWIRE_HOOK, custom-model-data: 0}
      hive: {material: BEE_NEST, custom-model-data: 0}
      flower-patch: {material: SUNFLOWER, custom-model-data: 0}
      apple: {material: APPLE, custom-model-data: 0}
      cover-anchor: {material: WHITE_CARPET, custom-model-data: 0}
      scarecrow: {material: CARVED_PUMPKIN, custom-model-data: 0}
      animal: {material: WHEAT_SEEDS, custom-model-data: 0}
      pen: {material: OAK_FENCE_GATE, custom-model-data: 0}
      diseased-crop: {material: FERMENTED_SPIDER_EYE, custom-model-data: 0}
      mole-mound: {material: MUD, custom-model-data: 0}
    # One order deterministically picks a count in this range, then uses that many
    # evenly spread checkpoints from incident-trigger-percents.
    incident-count: {min: 3, max: 5}
    incident-trigger-percents: [15, 32, 50, 68, 85]
    incident-quota: 4
    drought-patches: 3
    drought-coverage-percent: 35
    drought-min-beds: 30
    drought-max-beds: 40
    drought-initial-beds: 10
    drought-growth-beds: 8
    drought-growth-seconds: 2
    drought:
      water-radius: 5
      water-settle-ticks: 21
    # В одном заказе планировщик не повторяет события и допускает максимум
    # одно обычное полевое происшествие (вредители или засуха).
    incident-types: [GIANT_CROP, PROCESSING, BARN_FIRE, FROST, BOAR_BREAKOUT, RIVAL_RAID, TORNADO, HELL_GREENHOUSE, NIGHT_SHIFT, MARKET, BIRDS, FOOD_DELIVERY, PESTS, DROUGHT]
    special-incidents:
      giant-crop: {block-particle-stride: 4, hit-cooldown-millis: 90}
      tornado: {warning-seconds: 6, duration-seconds: 45, speed: 2.4, height: 24.0, radius: 7.0, debris-count: 28, hit-damage: 2.0}
      hell-greenhouse: {quota: 4, grow-seconds: 6, hot-seconds: 6, heat-limit: 100, heat-per-harvest: 10, evacuation-seconds: 15}
      birds: {min-count: 6, max-count: 14, beds-per-bird: 180, spawn-multiplier: 2, spawn-height: 4.0, flying-speed: 0.65, health: 4.0, eat-radius: 5.0, eat-interval-seconds: 3, ranged-contribution: 2, melee-contribution: 1}
      channels:
        # Disabled in automatic orders while the physical trench flow is tuned; admin stage remains available.
        automatic-enabled: false
        segments: 50
        marker-column-stride: 10
        flow-interval-ticks: 6
        completion-delay-ticks: 40
      boar-breakout:
        required-deflections: 8
        active-boars: 3
        movement-speed: 0.34
        aggro-radius: 28.0
        intercept-radius: 2.6
        facing-dot: 0.25
        crop-reach-radius: 1.35
        trample-radius: 1.35
        trample-crops-per-update: 2
        trample-particle-count: 8
        crop-damage-maximum: 4096
        shield-material: SHIELD
        shield-knockback-horizontal: 0.9
        shield-knockback-vertical: 0.32
      rival-raid:
        required-kills: 256
        worker-count: 120
        worker-spawn-batch-size: 12
        worker-patrol-batch-size: 32
        worker-entity: HUSK
        worker-health: 12.0
        worker-radius: 64.0
        worker-focus-radius: 34.0
        worker-retire-radius: 48.0
        worker-held-item: TORCH
        worker-light-level: 15
        worker-light-stride: 10
        worker-patrol-interval-ticks: 10
        worker-patrol-speed: 1.8
        flight-height: 14.0
        flight-speed: 0.30
        flight-steering: 0.65
        orbit-radius: 36.0
        orbit-look-ahead-degrees: 12.0
        orbit-period-seconds: 48
        maximum-riders: 4
        seat-spacing: 1.6
        seat-y-offset: -4.5
        # Uses the shared food-delivery-portal farm point as the departure ring.
        portal:
          width: 3.6
          height: 3.2
          label-height: 3.35
          label-scale: 1.8
          activation-seconds: 3
        player-time: 18000
        transition-seconds: 8
        maximum-distance: 512.0
        # gold_guns:gold_rpl20 from the live ItemsAdder pack.
        gun-material: PAPER
        gun-custom-model-data: 2100006
        gun-item-model: ''
        gun-damage: 6.0
        gun-range: 56.0
        # One trigger sends a short three-round burst: 20 rounds per second at sustained fire.
        gun-cooldown-ticks: 3
        gun-burst-rounds: 3
        gun-burst-interval-ticks: 1
        gun-ray-size: 0.55
        gun-spread-degrees: 1.25
        weapon-muzzle-forward: 2.2
        # gold_guns:gold_m79 from the live ItemsAdder pack.
        grenade-material: PAPER
        grenade-custom-model-data: 2100009
        grenade-item-model: ''
        grenade-damage: 48.0
        grenade-radius: 8.0
        grenade-cooldown-ticks: 8
        grenade-velocity: 1.2
        grenade-lifetime-ticks: 60
        grenade-preview-blocks: 96
        # Keep the damaged field visible for one minute; incident cleanup restores it immediately.
        grenade-preview-ticks: 1200
        grenade-preview-soil-material: COARSE_DIRT
        grenade-debris-blocks: 48
        grenade-debris-ticks: 34
      night-shift:
        placement-count: 90
        target-count: 24
        crop-min-spacing: 6.0
        player-time: 18000
        transition-seconds: 12
        patrols:
          min-count: 3
          max-count: 10
          beds-per-patrol: 250
          entity: HUSK
          min-spacing: 12.0
          roam-radius: 14.0
          path-refresh-seconds: 5
          spawn-min-player-distance: 8.0
          # Patrols neither enter nor damage players inside this radius around receiving.
          receiving-safe-radius: 15.0
          movement-speed: 0.27
          follow-range: 8.0
          attack-damage: 2.0
          held-item: TORCH
          # Real invisible light blocks follow patrols; particles alone do not emit light.
          light-level: 15
      market:
        crops: 256
        money-bonus-percent: 25
        timer: {base-seconds: 30, seconds-per-crop: 0.3, minimum-seconds: 90, maximum-seconds: 180}
      frost:
        campfires: {min-count: 4, max-count: 6, beds-per-campfire: 180}
        temperature: {target: 100, heat-per-second-per-fire: 2, cooling-seconds-per-degree: 10}
        fuel-seconds: 30
        pickup-radius: 1.75
        delivery-radius: 2.25
        fuel-material: OAK_LOG
        # Portable fallback. The server profile replaces this with the verified IA
        # firewood model and its analyzer-proven ground contact offset.
        woodpile: {material: OAK_LOG, custom-model-data: 0, display-transform: GROUND, scale: 1.0, y-offset: 0.0, yaw-offset: 0.0, view-range: 3.0}
        # Carried logs follow the same shared front-of-player geometry as harvest crates.
        carried: {scale: 1.5, y-offset: 0.65, forward-offset: 0.65, view-range: 2.0}
        # The glowing lantern and sparse blue particle column make every field fire readable at distance.
        campfire-marker: {material: SOUL_LANTERN, custom-model-data: 0, scale: 0.8, y-offset: 2.6, view-range: 3.0, particle-height: 4.0, particle-spacing: 0.65}
        atmosphere: {player-time: 13000, transition-seconds: 12, downfall: true}
    # Admin points are contact surfaces: stand on the floor/shelf and save the point.
    # Runtime profiles may replace these portable vanilla visuals with verified IA models
    # and their exact grounding y-offsets.
    processing:
      input-packages: 4
      machine-cycles: 3
      output-packages: 4
      interaction-radius: 2.2
      proximity-pickup-radius: 1.75
      delivery-radius: 2.4
      # The visible line remains at radius 3.2; one block of radial tolerance lets
      # players walk imperfect circles without losing angular progress.
      crank: {inner-radius: 2.4, outer-radius: 4.0, radius-tolerance: 1.0, max-step-distance: 1.2, title-reminder-seconds: 8, vertical-tolerance: 2.5}
      carried-y-offset: 0.95
      carried-forward-offset: 0.6
      cargo-watchdog: {reminder-seconds: 12, return-seconds: 30}
      cargo-progress-distance: 1.0
      spawn-per-tick: 4
      display-view-range: 3.0
      visuals:
        machine: {material: CRAFTING_TABLE, custom-model-data: 0, display-transform: FIXED, scale: 1.6, y-offset: 0.45, yaw-offset: 0.0}
        wheel: {material: GRINDSTONE, custom-model-data: 0, display-transform: FIXED, scale: 1.1, y-offset: 1.1, yaw-offset: 0.0}
        input-rack: {material: BARREL, custom-model-data: 0, display-transform: FIXED, scale: 1.3, y-offset: 0.4, yaw-offset: 0.0}
        output-pallet: {material: BARREL, custom-model-data: 0, display-transform: FIXED, scale: 1.0, y-offset: 0.25, yaw-offset: 0.0}
        raw-package: {material: WHEAT, custom-model-data: 0, display-transform: FIXED, scale: 1.0, y-offset: 0.65, yaw-offset: 0.0}
        product-package: {material: BREAD, custom-model-data: 0, display-transform: FIXED, scale: 1.0, y-offset: 0.65, yaw-offset: 0.0}
    # The barn/pen point anchors real fire whose spread and block damage are suppressed by the plugin.
    barn-fire:
      # The incident starts small and can ignite at most this many unique hotspots.
      hotspots: 36
      initial-hotspots: 6
      # While any flame survives, add one adjacent hotspot about three times per two seconds up to the cap.
      spread: {interval-ticks: 13, hotspots-per-pulse: 1}
      # Real fire blocks are materialized in bounded batches to avoid a start-tick spike.
      spawn-per-tick: 8
      placement-radius: 16
      min-spacing: 1.4
      vertical-search: 5
      spray: {range: 32.0, hit-radius: 3.2, cooldown-ticks: 5, particle-step: 0.55, side-streams: 4}
      flame-particle-interval-ticks: 5
      # Real flames remain visible; only this many receive extra smoke/particle decoration per pulse.
      particle-hotspot-limit: 32
    route-delivery:
      sample-distance: 2.5
      corridor-radius: 5.0
      hard-reset-distance: 9.0
      hard-correction-strength: 0.42
      corridor-correction-strength: 0.24
      # Wide final arrival zone, rendered as a bright particle ring and column.
      checkpoint-radius: 8.0
      horse-speed: 0.17
      horse-jump-strength: 0.45
      player-time: 18000
      transition-seconds: 18
      # Geometry is intentionally ignored: ordinary stairs, slabs and turns
      # cannot trigger recovery. Only prolonged lack of movement/progress can.
      inactivity: {reminder-seconds: 20, reset-seconds: 45, movement-distance: 2.0}
      trail: {lookahead-points: 28, height: 0.35, particle-size: 1.15, spacing: 0.7}
      completion-contribution: 12
      # Riders are dismounted at the destination, then returned to the farm after this pause.
      return-delay-seconds: 3
      # The admin food-delivery-portal point is exact; receiving is its fallback.
      portal: {width: 3.6, height: 3.2, label-height: 3.35, label-scale: 1.8, arrival-side-offset: 3.0, activation-seconds: 3}
      cart-scale: 4.4
      cart-back-offset: 2.15
      # cart_2 reaches -0.825 blocks at scale 4.4 after its JSON GROUND transform;
      # the remaining 0.05 keeps its wheels visible above uneven terrain.
      cart-y-offset: 0.875
      cart-load-count: 4
      cart-load-spacing: 0.24
      monsters:
        # Ambushes are planned from route length, not a timer while the cart is moving.
        distance-per-ambush: 120.0
        max-ambushes: 3
        # Never attack inside the farm; leave this much road after its boundary too.
        after-farm-distance: 20.0
        end-safe-distance: 20.0
        max-alive: 12
        spawn-distance: 10.0
        wave-min: 5
        wave-max: 8
        spawn-min-multiplier: 0.8
        spawn-max-multiplier: 1.15
        phantom-spawn-height: 7.0
        types: [HUSK, ZOMBIE, SKELETON, SPIDER, PHANTOM]
        movement-speed: 0.25
        light-level: 15
      gunner:
        # The invisible interaction covers the cart, so either the cart or horse is easy to click.
        # A shallow seat keeps the passenger on the rear bench instead of above the driver's camera.
        seat-y-offset: -0.15
        seat-back-offset: 0.65
        interaction-width: 2.8
        interaction-height: 0.7
        # voxelspawns_megaflintlocks:vs_rifle_double from the live ItemsAdder pack.
        material: CROSSBOW
        custom-model-data: 2100103
        item-model: ''
        damage: 7.0
        range: 42.0
        cooldown-ticks: 6
        ray-size: 0.65
        trail-length: 10
    pest-entity: SILVERFISH
    pest-spawn-radius: 6
    pest-nests: 3
    pest-nest-health: 3
    pest-spawns-per-nest: 3
    pest-max-alive: 6
    pest-spawn-interval-seconds: 4
    pest-spawn-chance-percent: 45
    pest-eat-radius: 3
    pest-eat-per-pulse: 8
    pest-eat-interval-millis: 1000
    pest-nest-min-spacing: 16.0
    pest-nest-display-scale: 2.0
    scarecrow-carried-forward-offset: 0.7
    crop-effects:
      harvest-burst: {block-particle-count: 14, dust-particle-count: 7, composter-particle-count: 3, poof-particle-count: 5}
    # Routine incidents preserve a field reserve; boar breakout uses its own event cap below.
    damage-safety: {maximum-percent: 18, minimum-remaining: 128, birds-maximum: 96, pests-maximum: 128, disease-maximum: 96}
    supplies:
      tool: {x: 212.5, y: 49.0, z: 448.5}
