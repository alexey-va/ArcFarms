          market: {slot: 30, template: enterprise-market}
          back: {slot: 36, template: back}
      enterprise-shares:
        schema-version: 1
        rows: 5
        background: {template: background}
        elements:
          status: {slot: 10, kind: decoration, template: enterprise-share-status}
          holding: {slot: 12, kind: decoration, template: enterprise-share-holding}
          account: {slot: 14, kind: decoration, template: enterprise-share-account}
          withdraw: {slot: 32, template: enterprise-share-withdraw}
          back: {slot: 36, template: back}
        regions:
          buy-options: {slots: [19, 20, 21, 22, 23, 24, 25]}
      enterprise-participation:
        schema-version: 1
        rows: 3
        background: {template: background}
        elements:
          summary: {slot: 4, kind: decoration, template: enterprise-report}
          steady: {slot: 10, template: enterprise-plan-steady}
