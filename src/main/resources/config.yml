  menus:
    layouts:
      main:
        schema-version: 1
        rows: 3
        elements:
          farm: {slot: 2, template: farm}
          lumber: {slot: 4, template: lumber}
          mine: {slot: 6, template: mine}
          workday: {slot: 19, template: workday}
          companies: {slot: 22, template: companies}
          stats: {slot: 25, kind: decoration, template: stats}
        background: {template: background}
      market:
        schema-version: 1
        rows: 3
        background: {template: background}
        elements:
          order: {slot: 13, kind: decoration, template: market-order}
          accept: {slot: 11, template: market-accept}
