      enterprise-confirm:
        schema-version: 1
        rows: 3
        background: {template: background}
        elements:
          confirm: {slot: 13, template: enterprise-share-confirm}
          back: {slot: 18, template: back}
      farm-perks:
        schema-version: 1
        rows: 4
        background: {template: background}
        elements:
          balance: {slot: 4, kind: decoration, template: perk-balance}
