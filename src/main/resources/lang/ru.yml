  command-help:
    edit: '<prefix> <white>/arcfarms admin edit</white> <gray>— включает режим перестройки: можно ломать управляемые грядки во время заказа, а ArcFarms удалит их записи восстановления.</gray>'
    inspect: '<prefix> <white>/arcfarms admin inspect</white> <gray>— включает безопасную инспекцию: нажмите на блок, чтобы увидеть BlockData, записи восстановления и текущий контроль ArcFarms.</gray>'
    blockreset: '<prefix> <white>/arcfarms admin blockreset \<зона></white> <gray>— в свободной ферме забывает прежнюю карту блоков и порциями заново индексирует доступные грядки, арбузы, тыквы и листву. Состояние: </gray><white>/arcfarms admin blockreset \<зона> status</white>'
    backup: '<prefix> <white>/arcfarms admin backup zone save</white> <gray>— сохранить весь привязанный регион фермы без WorldEdit-выделения.</gray><newline><white>/arcfarms admin backup zone list</white> <gray>— список копий; </gray><white>status</white> <gray>— прогресс.</gray><newline><white>/arcfarms admin backup zone restore id</white> <gray>— восстановить копию. Перед восстановлением автоматически создаётся страховочная копия текущих блоков.</gray>'
    points: '<prefix> <white>/arcfarms admin points \<зона></white> <gray>— показывает действующие координаты всех точек фермы, включая значения из конфига и админские переопределения.</gray>'
    unmanage: '<prefix> <white>/arcfarms admin unmanage \<зона></white> <gray>— снимает управление ArcFarms со всех известных грядок в текущем выделении WorldEdit и удаляет их записи восстановления.</gray>'
    next: '<prefix> <white>/arcfarms admin next \<зона></white> <gray>— переводит тестовый заказ на следующий осмысленный этап.</gray>'
    finish: '<prefix> <white>/arcfarms admin finish \<зона></white> <gray>— завершает заказ через обычную доставку, восстановление поля и выдачу наград.</gray>'
