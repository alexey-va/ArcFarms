surfaces:
  dialogs:
  - id: arcfarms-dialog-main
    source: farms
    format: reference-multi-action
    name-key: menu.title
    external-title-key: menu.title
    columns: 2
    body:
    - id: intro
      text-key: dialog.intro.main
      width: 440
    - id: stats
      text-key: menu.stats.lore
      width: 440
      placeholders:
        farm: '86'
        lumber: '42'
        mine: '31'
    buttons:
    - id: farm
      text-key: menu.farm.name
      tooltip-key: menu.farm.lore
      width: 210
    - id: lumber
      text-key: menu.lumber.name
      tooltip-key: menu.lumber.lore
      width: 210
    - id: mine
      text-key: menu.mine.name
      tooltip-key: menu.mine.lore
      width: 210
    - id: workday
      text-key: menu.workday.name
      tooltip-key: menu.workday.lore
      width: 210
      placeholders:
        cycle: '12'
        farm: ✓ ферма
        lumber: лес
        mine: шахта
    - id: companies
      text-key: menu.companies.name
      tooltip-key: menu.companies.lore
      width: 210
    - id: help
      text-key: dialog.help
      tooltip-key: dialog.help
      width: 210
    - id: close
      text-key: dialog.close
      tooltip-key: dialog.close
      width: 210
    viewport:
    - 960
    - 600
    variants:
    - id: default
  - id: arcfarms-dialog-market
    source: farms
    format: reference-multi-action
    name-key: farm.market-menu.title
    external-title-key: farm.market-menu.title
    columns: 2
    body:
    - id: intro
      text-key: dialog.intro.market
      width: 440
    - id: order
      text-key: farm.market-menu.order
      width: 440
      placeholders:
        crop: Пшеница
        amount: '120'
    buttons:
    - id: accept
      text-key: farm.market-menu.accept
      tooltip-key: farm.market-menu.choose
      width: 210
    - id: decline
      text-key: farm.market-menu.decline
      tooltip-key: farm.market-menu.choose
      width: 210
    - id: close
      text-key: dialog.close
      tooltip-key: dialog.close
      width: 210
    viewport:
    - 960
    - 600
    variants:
    - id: pending
  - id: arcfarms-dialog-enterprise-farm
    source: farms
    format: reference-multi-action
    name-key: companies.farm-detail.title
    external-title-key: companies.farm-detail.title
    columns: 2
    body:
    - id: intro
      text-key: dialog.intro.enterprise-farm
      width: 440
    - id: header
      text-key: companies.farm-detail.header.lore
      width: 440
    buttons:
    - id: report
      text-key: companies.farm-detail.report.name
      tooltip-key: companies.farm-detail.report.personal
      width: 210
      placeholders:
        amount: 2 400
        time: 07.09.2026 04:00 Europe/Moscow
    - id: workers
      text-key: companies.farm-detail.workers.name
      tooltip-key: companies.farm-detail.workers.contribution
      width: 210
      placeholders:
        orders: '37'
        contribution: '86'
    - id: policy
      text-key: companies.farm-detail.policy.name
      tooltip-key: companies.farm-detail.policy.open
      width: 210
    - id: license
      text-key: companies.farm-detail.license.name
      tooltip-key: companies.farm-detail.license.outcome
      width: 210
    - id: shares
      text-key: companies.farm-detail.shares.name
      tooltip-key: companies.farm-detail.shares.live-lore
      width: 210
    - id: market
      text-key: companies.farm-detail.market.name
      tooltip-key: companies.farm-detail.market.lore
      width: 210
    - id: back
      text-key: companies.back.name
      tooltip-key: companies.back.lore
      width: 210
    viewport:
    - 960
    - 600
    variants:
    - id: active-shadow
  - id: arcfarms-dialog-enterprise-participation
    source: farms
    format: reference-multi-action
    name-key: companies.participation.title
    external-title-key: companies.participation.title
    columns: 2
    body:
    - id: intro
      text-key: dialog.intro.enterprise-participation
      width: 440
    - id: summary
      text-key: companies.participation.summary
      width: 440
      placeholders:
        plan: Командный план
    - id: voting
      text-key: companies.participation.voting
      width: 440
      placeholders:
        week: '07.09'
    - id: quorum
      text-key: companies.participation.quorum
      width: 440
    - id: progress
      text-key: companies.participation.project-progress
      width: 440
      placeholders:
        stage: '2'
        orders: '37'
        target: '50'
    - id: purpose
      text-key: companies.participation.project-purpose
      width: 440
    buttons:
    - id: steady
      text-key: companies.participation.steady.name
      tooltip-key: companies.participation.steady.lore
      width: 210
    - id: team
      text-key: companies.participation.team.name
      tooltip-key: companies.participation.team.lore
      width: 210
    - id: challenge
      text-key: companies.participation.challenge.name
      tooltip-key: companies.participation.challenge.lore
      width: 210
    - id: back
      text-key: companies.back.name
      tooltip-key: companies.back.lore
      width: 210
    viewport:
    - 960
    - 720
    variants:
    - id: eligible
  - id: arcfarms-dialog-enterprise-confirm
    source: farms
    format: reference-multi-action
    name-key: companies.shares.confirm.name
    external-title-key: companies.shares.confirm.title
    columns: 1
    body:
    - id: intro
      text-key: dialog.intro.enterprise-confirm
      width: 440
    - id: cost
      text-key: companies.shares.confirm.cost
      width: 440
      placeholders:
        amount: 250 000
    - id: effect
      text-key: companies.shares.confirm.effect
      width: 440
      placeholders:
        shares: '5'
        limit: '20'
    - id: warning
      text-key: companies.shares.confirm.warning
      width: 440
    - id: license
      text-key: companies.shares.confirm.license
      width: 440
      placeholders:
        percent: '50'
    - id: risk
      text-key: companies.shares.confirm.risk
      width: 440
    buttons:
    - id: confirm
      text-key: companies.shares.confirm.name
      tooltip-key: companies.shares.confirm.click
      width: 210
      placeholders:
        shares: '5'
    - id: back
      text-key: companies.back.name
      tooltip-key: companies.back.lore
      width: 210
    viewport:
    - 960
    - 600
    variants:
    - id: purchase
  - id: arcfarms-dialog-farm-perks
    source: farms
    format: reference-multi-action
    name-key: farm.perk-menu.title
    external-title-key: farm.perk-menu.title
    columns: 2
    body:
    - id: intro
      text-key: dialog.intro.farm-perks
      width: 440
    - id: balance
      text-key: farm.perk-menu.balance
      width: 440
      placeholders:
        points: '12'
    buttons:
    - id: harvest-area
      text-key: perk.harvest_area.name
      tooltip-key: perk.harvest_area.description
      width: 210
    - id: speed
      text-key: perk.speed.name
      tooltip-key: perk.speed.description
      width: 210
    - id: sustenance
      text-key: perk.sustenance.name
      tooltip-key: perk.sustenance.description
      width: 210
    - id: reward-boost
      text-key: perk.reward_boost.name
      tooltip-key: perk.reward_boost.description
      width: 210
    - id: close
      text-key: dialog.close
      tooltip-key: dialog.close
      width: 210
    viewport:
    - 960
    - 600
    variants:
    - id: default
